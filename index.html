<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarah and the Fading World — Level 1</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:18px;color:#2b2540;font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:#f6ead2 radial-gradient(#e8d6b0 1.2px,transparent 1.4px) 0 0/14px 14px}
  main{width:min(100%,980px);margin:auto}
  h1{margin:0 0 10px;font-size:clamp(1.3rem,3vw,1.9rem);letter-spacing:.5px;color:#fff;display:inline-block;
    background:#e5577b;padding:4px 18px 6px;border:3px solid #2b2540;border-radius:14px;box-shadow:0 0 0 5px #fff,5px 7px 0 5px #2b254033;transform:rotate(-1deg)}
  canvas{display:block;width:100%;height:auto;border:4px solid #2b2540;border-radius:16px;background:#bfe7f3;box-shadow:0 0 0 6px #fff,6px 9px 0 6px #2b254030;cursor:pointer}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:18px}
  .help{flex:1 1 520px;margin:0;font-size:14px}
  kbd{display:inline-block;min-width:1.65em;padding:0 5px;border:2px solid #2b2540;border-bottom-width:4px;border-radius:6px;background:#fff;text-align:center;font:inherit;font-weight:700;font-size:13px}
  .button{border:3px solid #2b2540;border-radius:12px;padding:7px 14px;background:#17a398;color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #2b2540}
  .button:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2540}
  .button.action{background:#f08a3c}
  .button:disabled{background:#c9c0b0;cursor:default;box-shadow:0 4px 0 #8d8578}
  #message{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<main>
  <h1>Sarah and the Fading World — Level 1</h1>
  <canvas id="game" width="960" height="540" aria-label="Game screen"></canvas>
  <div class="controls">
    <p class="help"><kbd>A</kbd><kbd>D</kbd> / arrows move · <kbd>W</kbd>/<kbd>↑</kbd> jump or climb · <kbd>S</kbd>/<kbd>↓</kbd> climb down · <kbd>Space</kbd> activate / talk · <kbd>Q</kbd> Buddy power · <kbd>I</kbd> pockets · <kbd>R</kbd> back to Save Block</p>
    <button class="button action" id="activate" disabled>Activate</button>
    <button class="button" id="inventory">Pockets</button>
  </div>
  <p id="message" aria-live="polite"></p>
</main>
<script>
(()=>{
"use strict";
// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------
const c=document.querySelector("#game"),W=960,H=540,G=440,WORLD=3150;
let g=c.getContext("2d");
const actionBtn=document.querySelector("#activate"),invBtn=document.querySelector("#inventory"),live=document.querySelector("#message");
const INK="#2b2540",FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const keys=new Set();
const s={x:120,y:G-68,w:42,h:68,vy:0,ground:true,face:1,flip:1,squash:1,walk:0,inv:0,wasGround:true};
let scene="bedroom",camera=0,health=10,coins=0,time=0;
let toastText="",toastTimer=0,invOpen=false,shake=0,flash=0,showEndScreen=false,endT=0;
let doorOpen=false,closetOpen=false,potionCollected=false,roadChestKeyCollected=false,homeIntroSeen=false,residentDoorOpen=false,residentTalked=false,ladderCollected=false,ladderGiven=false,firstChestOpen=false,grandChestOpen=false,hasDab=false,checkpoint=1180,roofItemCollected=false,bedBounced=false;
let stormStarted=false,stormDone=false,flowerTalked=false,firstFlowerTalked=false,bonusFlowerTalked=false,flowerRestored=false,fountainKeyCollected=false,gateKey=false,gateOpen=false,complete=false,saveTalked=false,mailRead=false;
let gateAnim=0,tearT=0,grayT=0,restoreR=0,pulse=0,firstStomp=false,catTalk=0,easelTalk=0;
let items=[],loot=[],parts=[];
const dab={x:80,y:G-60};

const platforms=[{x:1360,y:330,w:90,h:18},{x:1475,y:230,w:80,h:16}];
const fountain={x:1045};
const flowers=[
  {x:720,kind:"guide"},{x:930},{x:1280,kind:"bonus"},{x:1700},{x:1990},{x:2380},{x:2620},{x:2800,kind:"gray"}
].map(f=>({...f,wig:0}));
const grayFlower=flowers.find(f=>f.kind==="gray");
const doodles=[
  {scene:"bedroom",x:300,y:250},{scene:"resident",x:850,y:190},
  {scene:"outside",x:640,y:G-175},{scene:"outside",x:1240,y:G-150},{scene:"outside",x:2120,y:G-150},{scene:"outside",x:3060,y:G-210}
].map(d=>({...d,found:false}));
let smudges=[];

// ---------------------------------------------------------------------------
// Little helpers
// ---------------------------------------------------------------------------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const center=()=>s.x+s.w/2;
const near=(x,d=68)=>Math.abs(center()-x)<d;
const onFloor=()=>s.y+s.h>=G-1;
const has=n=>items.includes(n);
const addItem=n=>{if(!items.includes(n))items.push(n)};
const removeItem=n=>{items=items.filter(i=>i!==n)};
function sayToast(t){toastText=t;toastTimer=3.4;live.textContent=t}
function burst(x,y,n=14,colors=["#f4c84f","#e5577b","#17a398","#7cc6f2","#fff"]){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=120+Math.random()*220;parts.push({scene,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-160,life:1+Math.random()*.6,rot:Math.random()*6,vr:(Math.random()-.5)*12,color:colors[i%colors.length]})}}
function spill(x,y,type,name,dx){loot.push({scene,x,y,vx:dx??(Math.random()-.5)*180,vy:-380,type,name,got:false,wait:.45})}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function circle(x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2)}
function wrap(text,maxW,font){g.font=font;const out=[];for(const para of text.split("\n")){let line="";for(const w of para.split(" ")){const t=line?line+" "+w:w;if(line&&g.measureText(t).width>maxW){out.push(line);line=w}else line=t}out.push(line)}return out}

// A flat "paper cut-out" piece: soft drop shadow, white paper edge, flat fill, ink line.
function cut(build,fill,o={}){
  g.save();g.lineJoin="round";g.lineCap="round";
  if(o.shadow!==false){g.save();g.translate(4,5);build();g.fillStyle="rgba(60,40,30,.2)";g.fill();g.restore()}
  build();if(o.edge!==0){g.lineWidth=o.edge||7;g.strokeStyle="#fff";g.stroke()}
  g.fillStyle=fill;g.fill();if(o.line!==0){g.lineWidth=o.line||2.5;g.strokeStyle=o.ink||INK;g.stroke()}
  g.restore();
}

// Characters are drawn into a scratch canvas, then given a white paper border and a drop shadow,
// so they look like stickers / cardboard cut-outs. sx < 0 mirrors them (the paper-thin turn).
const sprA=document.createElement("canvas"),sprB=document.createElement("canvas");sprA.width=sprB.width=sprA.height=sprB.height=200;
const ca=sprA.getContext("2d"),cb=sprB.getContext("2d");
function sprite(cx,footY,w,h,draw,o={}){
  const pad=10,ow=o.outline??4,main=g;
  ca.clearRect(0,0,200,200);g=ca;g.save();g.translate(pad,pad);g.lineJoin="round";g.lineCap="round";draw();g.restore();g=main;
  cb.globalCompositeOperation="source-over";cb.clearRect(0,0,200,200);
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;cb.drawImage(sprA,Math.cos(a)*ow,Math.sin(a)*ow)}
  cb.globalCompositeOperation="source-in";cb.fillStyle="#fff";cb.fillRect(0,0,200,200);
  cb.globalCompositeOperation="source-over";cb.drawImage(sprA,0,0);
  g.save();g.translate(cx,footY);if(o.rot)g.rotate(o.rot);g.scale(o.sx??1,o.sy??1);if(o.alpha!=null)g.globalAlpha=o.alpha;
  if(o.shadow!==false){g.shadowColor="rgba(50,35,25,.3)";g.shadowOffsetX=4;g.shadowOffsetY=5}
  g.drawImage(sprB,-w/2-pad,-h-pad);g.restore();
}
function groundShadow(x,y,rx){g.fillStyle="rgba(43,37,64,.18)";g.beginPath();g.ellipse(x,y,rx,rx*.22,0,0,7);g.fill()}

// Paper grain overlay
const grain=(()=>{const p=document.createElement("canvas");p.width=p.height=96;const q=p.getContext("2d");for(let i=0;i<420;i++){q.fillStyle=Math.random()<.5?"rgba(255,255,255,.14)":"rgba(80,60,40,.06)";q.fillRect(Math.random()*96,Math.random()*96,Math.random()*2+1,Math.random()*2+1)}return g.createPattern(p,"repeat")})();

// ---------------------------------------------------------------------------
// Dialogue (speech bubbles drawn on the canvas, with a typewriter effect)
// ---------------------------------------------------------------------------
const dlg={on:false,pages:[],page:0,chars:0,after:null};
function start(pages,done){dlg.on=true;dlg.pages=pages;dlg.page=0;dlg.chars=0;dlg.after=done||null;announce()}
function announce(){const p=dlg.pages[dlg.page];if(p)live.textContent=p[0]+": "+p[1]}
function advance(){if(!dlg.on)return;const p=dlg.pages[dlg.page];if(dlg.chars<p[1].length){dlg.chars=p[1].length;return}
  if(++dlg.page<dlg.pages.length){dlg.chars=0;announce();return}
  dlg.on=false;const fn=dlg.after;dlg.after=null;if(fn)fn()}
const speakerColor={"Sarah":"#17a398","Mrs. Maple":"#d0648f","Flower":"#e1a21b","Dab":"#3b8fd6","Save Block":"#c98a12","Mr. Biscuits":"#8a6a4d","Sign":"#8a6a4d","Letter":"#8a6a4d"};
function speakerPos(who){
  if(who==="Sarah")return[center()-camera,s.y-4];
  if(who==="Dab")return[dab.x-camera,dab.y-30];
  if(who==="Mrs. Maple")return[217,G-80];
  if(who==="Mr. Biscuits")return[330,G-30];
  if(who==="Save Block")return[1201-camera,G-90];
  if(who==="Flower"){const f=flowers.reduce((b,f)=>Math.abs(f.x-center())<Math.abs(b.x-center())?f:b);return[f.x-camera,G-90]}
  return null;
}
function drawDialogue(){
  if(!dlg.on)return;const [who,text]=dlg.pages[dlg.page];const shown=text.slice(0,Math.floor(dlg.chars));
  const narr=who==="Narrator"||who==="Letter";const bw=720,bx=(W-bw)/2,by=22;
  const lines=wrap(text,bw-64,"bold 21px "+FONT),bh=40+lines.length*29;
  const pos=narr?null:speakerPos(who);
  g.save();
  if(narr){
    cut(()=>rr(bx,by,bw,bh,10),who==="Letter"?"#fffaf0":"#2f2a4a",{edge:8});
    if(who==="Letter"){g.strokeStyle="#9fc7e8";g.lineWidth=1.5;for(let y=by+44;y<by+bh-6;y+=29){g.beginPath();g.moveTo(bx+20,y);g.lineTo(bx+bw-20,y);g.stroke()}}
  }else{
    const tx=pos?clamp(pos[0],bx+60,bx+bw-60):W/2,ty=pos?Math.max(by+bh+20,Math.min(pos[1]-10,by+bh+42)):by+bh+20;
    cut(()=>{g.beginPath();g.roundRect(bx,by,bw,bh,30);g.moveTo(tx-26,by+bh-2);g.lineTo(tx+(pos?clamp((pos[0]-tx)*.3,-30,30):0),ty);g.lineTo(tx+24,by+bh-2)},"#fffdf6",{edge:9});
    g.fillStyle="#fffdf6";g.fillRect(tx-23,by+bh-6,45,6);
    // name tag
    g.font="bold 16px "+FONT;const nw=g.measureText(who.toUpperCase()).width+30;
    cut(()=>rr(bx+28,by-14,nw,28,14),speakerColor[who]||"#17a398",{edge:6,shadow:false});
    g.fillStyle="#fff";g.textAlign="center";g.fillText(who.toUpperCase(),bx+28+nw/2,by+6);
  }
  g.textAlign="left";g.font=(narr&&who==="Narrator"?"italic bold 21px ":"bold 21px ")+FONT;g.fillStyle=narr&&who==="Narrator"?"#fff4d6":INK;
  let left=shown.length;lines.forEach((ln,i)=>{const piece=ln.slice(0,Math.max(0,left));left-=ln.length+1;g.fillText(piece,bx+32,by+40+i*29)});
  if(dlg.chars>=text.length){const bob=Math.sin(time*8)*3;g.fillStyle=narr&&who==="Narrator"?"#f4c84f":"#e5577b";g.beginPath();g.moveTo(bx+bw-40,by+bh-22+bob);g.lineTo(bx+bw-24,by+bh-22+bob);g.lineTo(bx+bw-32,by+bh-12+bob);g.fill()}
  g.restore();
}

// ---------------------------------------------------------------------------
// Story: what can Sarah activate right now?
// ---------------------------------------------------------------------------
function objective(){
  if(complete)return"Level 1 complete! The festival awaits on the other side of the gate.";
  if(gateKey)return"Head all the way back left to the mysterious gate and unlock it with the Town Gate Key.";
  if(hasDab)return"Find the gray, crying flower near the end of the road and let Dab bring its color back (Space next to it).";
  if(ladderGiven)return grandChestOpen?"":(has("Grandma's Chest Key")?"Climb the ladder in Mrs. Maple's house and open Grandma's chest.":"Grandma's chest needs a key. Rumor has it the fountain's upside-down stream coughs things up. Jump in!");
  if(ladderCollected)return"Bring the ladder back to Mrs. Maple. It's folded flat in your pocket, as one does.";
  if(residentTalked)return"Find a ladder for Mrs. Maple. Trees are notorious ladder borrowers — check the far end of the road.";
  if(flowerTalked)return"Find Dab, the legendary little buddy. Old things hide in old chests — maybe ask a neighbor?";
  if(stormDone)return"Something drained the color from a flower down the road. Investigate — and maybe pop into Mrs. Maple's blue house.";
  if(scene==="bedroom"&&!homeIntroSeen)return(potionCollected&&roadChestKeyCollected)?"Head out the front door. Space opens it; Space again steps outside.":"Grab your things from the wardrobe (walk into them), then head out the front door.";
  return"A gate appeared overnight to the left. Explore the road to the right to find out why.";
}
function getInteract(){
  if(scene==="bedroom"){
    if(near(645,50)&&!closetOpen)return["Open the wardrobe",()=>{closetOpen=true;burst(645,360,10);sayToast("The wardrobe creaks open. A potion and a tiny key try to look casual.")}];
    if(near(527,26))return["Admire your painting",easel];
    if(near(833,55))return[doorOpen?"Go outside":"Open the door",()=>{if(!doorOpen){doorOpen=true;sayToast("The door swings open. Fresh air! Unsupervised daylight!")}else goOutside()}];
  }
  if(scene==="outside"){
    if(near(255)&&!gateOpen)return[gateKey?"Unlock the gate":"Inspect the gate",gate];
    if(near(465,50)&&onFloor())return[doorOpen?"Go inside":"Open your door",()=>{if(!doorOpen){doorOpen=true;sayToast("Your front door, reporting for duty.")}else{scene="bedroom";s.x=790;s.y=G-s.h;doorOpen=false;sayToast("Back in your room. It still smells like paint.")}}];
    if(near(1515,50)&&onFloor())return[residentDoorOpen?"Go inside":"Knock on the door",()=>{if(!residentDoorOpen){residentDoorOpen=true;sayToast("Knock knock. The door opens itself. Very trusting neighborhood.")}else{scene="resident";s.x=93;s.y=G-s.h;residentDoorOpen=false;camera=0}}];
    if(near(595,24))return["Check the mailbox",mailbox];
    if(near(720))return["Talk to the flower",guideFlower];
    if(near(850)&&!firstChestOpen)return[has("Road Chest Key")?"Unlock the chest":"Inspect the chest",roadChest];
    if(near(1201,40))return["Talk to the Save Block",saveBlock];
    if(near(1280))return["Talk to the flower",bonusFlower];
    if(near(2800)&&stormDone)return[hasDab&&!flowerRestored?"Restore color with Dab":"Talk to the flower",sadFlower];
    if(near(2985,55)&&!ladderCollected)return["Take the ladder",()=>{ladderCollected=true;addItem("Wooden Ladder");burst(2985,G-60,10);sayToast("You take the ladder. It folds completely flat into your pocket. Everything does, around here.")}];
  }
  if(scene==="resident"){
    if(near(114,48))return[residentDoorOpen?"Leave the house":"Open the door",()=>{if(!residentDoorOpen){residentDoorOpen=true}else{scene="outside";s.x=1494;s.y=G-s.h;residentDoorOpen=false;sayToast("Back on the road.")}}];
    if(near(217,62)&&onFloor())return["Talk to Mrs. Maple",mrsMaple];
    if(near(330,30)&&onFloor())return["Pet the cat",cat];
    if(near(719,50)&&ladderGiven&&!grandChestOpen&&s.y+s.h<=290)return[has("Grandma's Chest Key")?"Unlock Grandma's chest":"Inspect Grandma's chest",grandmaChest];
  }
  return null;
}
function goOutside(){
  scene="outside";s.x=444;s.y=G-s.h;doorOpen=false;camera=clamp(s.x-350,0,WORLD-W);
  if(!homeIntroSeen){homeIntroSeen=true;start([
    ["Sarah","Okay. Banner? Check. Shoes? Check. Giant mysterious gate?"],
    ["Sarah","...Wait. Was that gate there last night?"],
    ["Sarah","No. It was not. I walk through that exact spot every day, specifically because there is no gate there."],
    ["Sarah","And it's LOCKED. With the art festival on the other side. Rude."],
    ["Narrator","Things that appear overnight usually have a reason. The reason is probably down the road to the right."]
  ])}
}
function easel(){const lines=["Your masterpiece: \"Self-Portrait as a Teapot.\" Bold. Brave. Smudged three times.","The paint is 94% dry. The other 6% is on your elbow.","You whisper \"you're doing great\" to the painting. It is a painting. It does not reply."];sayToast(lines[easelTalk++%3])}
function mailbox(){if(!mailRead){mailRead=true;start([["Letter","Dear Artist: the Town Art Festival begins at noon. Late entries will be judged personally by the Committee's cat, Mr. Biscuits, who hates everything."],["Letter","Warmly (but firmly), The Festival Committee. P.S. Please stop painting the ducks."],["Sarah","Not the cat. Anybody but the cat."]])}else sayToast("The mailbox is empty. It looks relieved.")}
function gate(){
  if(!gateKey){sayToast("Locked tight. The keyhole is shaped like a tiny flower. Suspiciously specific.");return}
  removeItem("Town Gate Key");gateOpen=true;complete=true;burst(255,G-120,30);
  start([
    ["Sarah","The key fits! Of course it fits. It's shaped like a flower. Everything today is shaped like a flower."],
    ["Narrator","The gate swings wide. Beyond it, the town hums with music, banners, and the faint smell of wet paint."],
    ["Dab","Hang on. Where did that lightning come from? Who ripped the sky? Why doesn't anybody ask questions around here?!"],
    ["Narrator","Excellent questions. Saved, for now, for Level 2."]
  ],()=>{showEndScreen=true;endT=0});
}
function guideFlower(){
  flowers[0].wig=1;
  if(firstFlowerTalked){start([["Flower",fountainKeyCollected?"You rode the fountain! I'd clap, but, you know. Leaves.":"Still here! Still a flower! The fountain's just down the road. Jump into the stream!"]]);return}
  firstFlowerTalked=true;start([
    ["Flower","Psst! Hey! Down here! No — lower. Lower. I'm a flower."],
    ["Sarah","Oh! Hi, flower."],
    ["Flower","Have you SEEN the fountain? It's spraying straight up into the sky. Water is not supposed to do that. I checked."],
    ["Flower","Jump into the stream! It'll carry you somewhere. Probably somewhere important. Possibly just somewhere wet."]
  ]);
}
function bonusFlower(){
  flowers[2].wig=1;
  if(bonusFlowerTalked){start([["Flower","Still hatless. But I've made my peace with it."]]);return}
  bonusFlowerTalked=true;start([
    ["Flower","Ooh, a visitor! Here, take these three coins. I was saving up for a hat."],
    ["Sarah","Why not just buy the hat?"],
    ["Flower","I don't have a head. I'm all face. It's a whole thing. Please don't make it weird."]
  ],()=>{for(let i=0;i<3;i++)spill(1280,G-90,"coin",null,(i-1)*90);sayToast("The flower showers you in coins! Grab them!")});
}
function roadChest(){
  if(!has("Road Chest Key")){sayToast("Locked. It needs a small key — the kind that hides in wardrobes.");return}
  firstChestOpen=true;removeItem("Road Chest Key");spill(850,G-50,"item","Turnip",90);burst(879,G-40,14);
  sayToast("Click! A Turnip bounces out and lands with tremendous dignity.");
}
function saveBlock(){
  checkpoint=1180;health=10;burst(1201,G-70,12,["#f4c84f","#fff"]);
  if(!saveTalked){saveTalked=true;start([
    ["Save Block","Greetings, traveler. I am a Save Block. I remember things, so you don't have to."],
    ["Sarah","Do you remember… anything else?"],
    ["Save Block","I remember everything. I remember you tripping over the curb this morning. We don't need to discuss it."],
    ["Narrator","Health fully restored! Press R any time to hop back to this Save Block."]
  ]);return}
  sayToast("Saved! Health restored. The Save Block pretends not to watch you leave.");
}
function sadFlower(){
  grayFlower.wig=1;
  if(flowerRestored){start([["Flower","I'm yellow! I'm SO yellow! Go on, the gate's waiting. Way, way back to the left."]]);return}
  if(!flowerTalked){flowerTalked=true;const p=[
    ["Flower","*sniff* My color… it's gone! I'm gray! I look like a pencil sketch of myself!"],
    ["Sarah","Oh no. What happened?"],
    ["Flower","The lightning! The sky ripped and all my yellow just… drained out. Only mine! Why only mine?! I'm very likable!"],
    ["Sarah","Could Dab help? The little buddy from the old stories?"],
    ["Flower","Dab brings color back to things! Dab lived around here ages ago, traveling with a legendary hero. But nobody's seen Dab in forever."],
    ["Flower","Please find Dab. And hurry — I'm crying so much I'm basically watering myself."]
  ];p.push(hasDab?["Sarah","Oh! Dab's actually right here."]:["Sarah","I'll find Dab. Hang in there, little guy."]);start(p,hasDab?sadFlower:null);return}
  if(!hasDab){sayToast("The flower sniffles. It needs Dab's color-restoring touch.");return}
  start([
    ["Dab","Color incoming! Everybody stand back! Especially you, gray grass. You know what you did."],
    ["Narrator","SPLOOSH! A warm wash of color pours back into the flower, petal by petal."]
  ],()=>{flowerRestored=true;burst(2800,G-60,40);
    start([
      ["Flower","I'm YELLOW again! I'd forgotten how good yellow feels! It feels like a sneeze, but nice!"],
      ["Flower","Here, take this. It fell out of the sky when the lightning hit. Flower-shaped, like me. I think it's meant for you."],
      ["Sarah","The Town Gate Key! One mystery solved — and I might still make the festival!"],
      ["Dab","Do they have paint at the festival? Asking for me. I'm the paintbrush."]
    ],()=>{gateKey=true;addItem("Town Gate Key");sayToast("Got the Town Gate Key! Head back to the gate at the far left.")});
  });
}
function mrsMaple(){
  if(hasDab){start([["Mrs. Maple","Is that a paintbrush talking? How nice. In my day, paintbrushes just sat there and took it."]]);return}
  if(ladderGiven){start([["Mrs. Maple","Did you climb the ladder, dear? I'm only asking for the ladder. It worries."]]);return}
  if(residentTalked&&has("Wooden Ladder")){start([
    ["Sarah","Found your ladder! It was hanging out with a tree."],
    ["Mrs. Maple","I KNEW it. That tree has always been a bit shady."],
    ["Mrs. Maple","Hand it here, dear… a little unfold… a little lean… there! Right against the shelf."],
    ["Mrs. Maple","Up you go! Climb with W or Up. I'll hold it. Spiritually."]
  ],()=>{removeItem("Wooden Ladder");ladderGiven=true;burst(478,G-80,14);sayToast("Mrs. Maple set up the ladder. It reaches Grandma's chest!")});return}

  // heart
  g.save();g.translate(44,top+22);g.scale(1+Math.sin(time*5)*.04*(health<4?3:1),1);cut(()=>{g.beginPath();g.moveTo(0,10);g.bezierCurveTo(-18,-2,-10,-16,0,-7);g.bezierCurveTo(10,-16,18,-2,0,10)},"#e5577b",{edge:4,shadow:false});g.restore();
  g.fillStyle=INK;g.font="bold 22px "+FONT;g.fillText(health,66,top+30);g.font="bold 14px "+FONT;g.fillStyle="#7a7088";g.fillText("/ 10 HP",health>9?94:82,top+29);
  cut(()=>rr(196,top,104,44,22),"#fffdf6",{edge:7});drawCoin(220,top+22,11);g.fillStyle=INK;g.font="bold 22px "+FONT;g.fillText(coins,240,top+30);
  if(hasDab){cut(()=>rr(310,top,124,44,22),"#fffdf6",{edge:7});sprite(332,top+40,30,56,drawDabBody,{sx:.6,sy:.6,rot:-.3,shadow:false});g.fillStyle=INK;g.font="bold 14px "+FONT;g.fillText("Q: Buddy",350,top+28)}
  cut(()=>rr(W-142,18,124,36,18),"#fffdf6",{edge:6});g.fillStyle=INK;g.font="bold 14px "+FONT;g.fillText("I: Pockets",W-122,41);
  if(toastTimer>0){const a=Math.min(1,toastTimer*3,(3.4-toastTimer)*6),y=H-24-a*40;g.save();g.globalAlpha=Math.min(1,a*1.2);const lines=wrap(toastText,W-220,"bold 17px "+FONT),h=20+lines.length*22;
    cut(()=>rr(90,y-h+30,W-180,h,16),"#2f2a4a",{edge:7});g.fillStyle="#fff4d6";g.textAlign="center";lines.forEach((l,i)=>g.fillText(l,W/2,y-h+56+i*22));g.textAlign="left";g.restore()}
}
function drawEndScreen(){
  g.fillStyle=`rgba(43,37,64,${Math.min(.7,endT)})`;g.fillRect(0,0,W,H);
  const k=Math.min(1,endT*2),sc=.6+.4*(1-Math.pow(1-k,3));g.save();g.translate(W/2,H/2);g.scale(sc,sc);g.rotate(-.02);
  cut(()=>rr(-350,-125,700,250,30),"#fff3d6",{edge:12});
  for(let i=0;i<14;i++){g.fillStyle=["#e5577b","#f4c84f","#17a398","#7cc6f2"][i%4];g.beginPath();g.moveTo(-320+i*48,-125);g.lineTo(-296+i*48,-125);g.lineTo(-308+i*48,-100);g.fill()}
  g.fillStyle=INK;g.textAlign="center";g.font="bold 36px "+FONT;g.fillText("Thanks for playing Level 1!",0,-10);
  g.fillStyle="#17a398";g.font="bold 26px "+FONT;g.fillText("Level 2 will be created soon!",0,40);
  g.fillStyle="#7a7088";g.font="italic 16px "+FONT;g.fillText("Coins collected: "+coins+(roofItemCollected?"  ·  Roof secret: found!":"  ·  Roof secret: still up there…"),0,86);
  g.restore();g.textAlign="left";
  if(Math.random()<.3)parts.push({scene,x:camera+Math.random()*W,y:-10,vx:(Math.random()-.5)*60,vy:60,life:3,rot:0,vr:(Math.random()-.5)*8,color:["#e5577b","#f4c84f","#17a398","#7cc6f2"][Math.floor(Math.random()*4)]});
  g.save();g.translate(-camera,0);drawParticles();g.restore();
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let last=0;
function frame(t){const dt=Math.min((t-(last||t))/1000,.033);last=t;update(dt);
  g.save();if(shake>0)g.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*10*shake);
  if(scene==="bedroom")drawBedroom();else if(scene==="resident")drawResident();else drawOutside();
  g.restore();
  g.save();g.fillStyle=grain;g.fillRect(0,0,W,H);g.restore();
  if(flash>0){g.fillStyle=`rgba(255,255,255,${Math.min(.95,flash)})`;g.fillRect(0,0,W,H)}
  drawHud();if(invOpen)drawInventory();drawDialogue();if(showEndScreen)drawEndScreen();
  requestAnimationFrame(frame)}

start([
  ["Narrator","Once upon a Tuesday, in a town made mostly of paper and optimism, there lived an artist named Sarah."],
  ["Narrator","Today was the Town Art Festival. Sarah had painted a banner for it. Herself. By hand."],
  ["Sarah","The paint's almost dry. It only smudged three times. Four, if you count my face."],
  ["Narrator","Meanwhile, outside, the town fountain had started sending its water UP. Which is the wrong way."],
  ["Sarah","Okay! Grab my things from the wardrobe, then out the door. What could possibly be weird today?"],
  ["Narrator","(So many things.)"]
],()=>sayToast("Walk to the wardrobe and press Space to open it."));
requestAnimationFrame(frame);
window.__game={get s(){return s},get state(){return{scene,items,coins,health,hasDab,gateKey,complete,stormDone,flowerRestored,dlg:dlg.on}},interact:()=>{const it=getInteract();if(it)it[1]();return it&&it[0]},advanceAll:()=>{let n=0;while(dlg.on&&n++<60){dlg.chars=1e9;advance()}},tele:(x,sc)=>{if(sc)scene=sc;s.x=x-s.w/2;s.y=G-s.h;s.vy=0},openInv:(t)=>{invOpen=true;inv.tab=t||0}};
})();
</script>
